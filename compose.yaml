services:
  gymjournal-bot:
    build:
      context: .
      dockerfile: Containerfile
    depends_on:
      - postgres-db
    environment:
      # Aiven Runtime detects this reference and replaces the value with the
      # real Aiven for PostgreSQL connection URI (DATABASE_URL), which the bot
      # reads via libpq.
      - DATABASE_URL=postgresql://bot:bot@postgres-db:5432/gymjournal
      # Declared so Aiven Runtime passes it to the container; set the real
      # token as a Runtime secret with this key, never committed here.
      - GYMJOURNAL_API_KEY=${GYMJOURNAL_API_KEY}

  postgres-db:
    image: postgres:16
    environment:
      POSTGRES_DB: gymjournal
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
